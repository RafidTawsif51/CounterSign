# Publishes only sites/ (the fictional vendor websites for the phone lookup) to GitHub Pages, on every push to main that changes it.
# Nothing happens until Pages is switched to "GitHub Actions" in the repo settings: see docs/sites.md.
name: Publish vendor sites

on:
  push:
    branches: [main]
    paths: ["sites/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sites
      - id: deployment
        uses: actions/deploy-pages@v4
